[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rxcite"
version = "0.1.0"
description = "A measured RAG service over FDA drug labels: cited answers, hybrid search, reranking, and a refusal path."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vignesh Reddy Kethireddy" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.8",
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
    "judgekit-eval>=0.1.1",   # my own package: model providers + LLM judges
    "botocore[crt]>=1.34",    # lets boto3 use `aws login` credentials locally
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
rxcite = "rxcite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rxcite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*", "pgvector", "pgvector.*", "boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs a Postgres+pgvector database (RXCITE_TEST_DATABASE_URL)"]
